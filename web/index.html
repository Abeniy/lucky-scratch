<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸运刮刮乐 · Roguelike</title>
  <link rel="stylesheet" href="style.css?v=311" />
</head>
<body>
  <!-- 页面顶部：金币 / 等级进度 / 纪录 -->
  <header class="topbar">
    <div class="coins">
      <span class="score-label">得分：</span>
      <span id="coinValue" class="coin-value">100</span>
    </div>
    <div class="level-box">
      <div class="level-label">
        <span id="levelText">Lv.1</span>
        <span id="levelHint" class="level-hint">距下一级 150</span>
      </div>
      <div class="level-bar">
        <div id="levelFill" class="level-fill"></div>
      </div>
    </div>
    <div class="record">
      <span class="record-icon">🏆</span>
      <span id="recordValue" class="record-value">0</span>
    </div>
  </header>

  <!-- 页面顶部下方：已获得的肉鸽增益 -->
  <div id="perkBar" class="perk-bar"></div>

  <div id="game" class="game">
    <!-- 中央：刮卡台 + 说明面板 -->
    <main class="board">
      <section class="stage" aria-label="刮卡台">
        <div class="scratch-wrap">
          <div id="scratchArea" class="scratch-area">
            <div class="scratch-placeholder">鼠标滑过刮开~</div>
            <!-- Canvas 涂层将在步骤3注入 -->
          </div>
        </div>
        <aside id="cardInfo" class="card-info" aria-label="刮刮卡说明"></aside>
      </section>
    </main>

    <!-- 下方：分页购卡区（已并入舞台单元，随卡片一起缩放、相对位置恒定） -->
    <section class="card-dock" aria-label="购卡区">
      <button id="shopPrev" class="card-page-btn" type="button" aria-label="上一页（快捷键 A）"><span class="page-btn-key">A</span></button>
      <div id="shopList" class="slot-row card-slot-list"></div>
      <button id="shopNext" class="card-page-btn" type="button" aria-label="下一页（快捷键 D）"><span class="page-btn-key">D</span></button>
      <span id="shopPageLabel" class="card-page-label">1/2</span>
    </section>
  </div>

  <!-- 页面底部：状态提示与清档按钮 -->
  <footer class="statusbar">
    <span id="statusMsg" class="status-msg">选一张卡开始刮吧</span>
  </footer>

  <!-- 右侧：独立刮具栏 -->
  <aside class="tools tool-dock" aria-label="刮具栏">
    <!-- 刮具说明气泡：纸片素材，切换刮具时短暂显示在圆框左方 -->
    <div id="toolTip" class="tool-tip" aria-hidden="true">
      <span id="toolTipText" class="tool-tip-text"></span>
    </div>
    <div id="toolList" class="tool-list"></div>
  </aside>

  <!-- 调试入口：左下角小扳手，点开调试面板 -->
  <button id="debugBtn" class="debug-btn" type="button" aria-label="调试面板">🔧</button>
  <div id="debugPanel" class="debug-panel" aria-label="调试面板">
    <div class="debug-panel-title">调试面板</div>
    <button id="dbgUnlockAll" class="debug-item" type="button">🔓 解锁全部卡片与刮具</button>
    <button id="dbgLevelUp" class="debug-item" type="button">⬆️ 升一级（测试增益）</button>
    <button id="dbgReset" class="debug-item danger" type="button">🧹 清档重开</button>
  </div>

  <script src="game.js?v=133"></script>
</body>
</html>
